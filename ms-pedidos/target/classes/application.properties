server.port=8082
spring.application.name=ms-pedidos

# ───────────────────────────────────────────────────────────
# Persistencia: base de datos H2 embebida en archivo
# (cumple el requisito de persistencia real mediante JPA)
# ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/pedidos-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 (http://localhost:8082/h2-console) — util para verificar persistencia
# Nota de seguridad: solo accesible localmente (ver misma nota en ms-inventario).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ───────────────────────────────────────────────────────────
# Integración con MS-Inventario: al despachar un pedido se descuenta
# el stock del producto asociado (ver donaton.mspedidos.client.InventarioClient)
# ───────────────────────────────────────────────────────────
ms.inventario.url=http://localhost:8081

# PATRÓN: Circuit Breaker (Resilience4j) — misma configuración que usa el BFF
resilience4j.circuitbreaker.instances.msInventario.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msInventario.sliding-window-size=10
resilience4j.circuitbreaker.instances.msInventario.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msInventario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msInventario.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msInventario.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.msInventario.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msInventario.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.msInventario.slow-call-rate-threshold=80

pedidos.http.connect-timeout-ms=2000
pedidos.http.read-timeout-ms=3000

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ───────────────────────────────────────────────────────────
# Seguridad
# ───────────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Debe coincidir con app.security.api-key de MS-Inventario: MS-Pedidos la usa
# tanto para exigirla en sus propias escrituras como para autenticarse ante
# MS-Inventario al descontar stock.
app.security.api-key=${API_KEY:smartlogix-dev-key}
