server.port=8080
spring.application.name=bff-smartlogix

# URLs de los microservicios (sobrescribir en producción con variables de entorno)
ms.inventario.url=http://localhost:8081
ms.pedidos.url=http://localhost:8082

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ────────────────────────────────────────────────────────────────────────
# PATRÓN: Circuit Breaker (Resilience4j)
# ────────────────────────────────────────────────────────────────────────
# Evita que el BFF quede colgado esperando respuestas de un microservicio
# caído: tras un porcentaje de fallos, el circuito se ABRE y las siguientes
# llamadas van directo al método de fallback (sin red), dando tiempo a que
# el servicio se recupere antes de volver a intentarlo (HALF_OPEN).

# Circuito para las llamadas del BFF a MS-Inventario
resilience4j.circuitbreaker.instances.msInventario.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msInventario.sliding-window-size=10
resilience4j.circuitbreaker.instances.msInventario.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msInventario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msInventario.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msInventario.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.msInventario.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msInventario.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.msInventario.slow-call-rate-threshold=80

# Circuito para las llamadas del BFF a MS-Pedidos (centros de distribución y pedidos)
resilience4j.circuitbreaker.instances.msPedidos.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msPedidos.sliding-window-size=10
resilience4j.circuitbreaker.instances.msPedidos.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msPedidos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msPedidos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msPedidos.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.msPedidos.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msPedidos.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.msPedidos.slow-call-rate-threshold=80

# Timeouts de RestTemplate: sin esto, una llamada colgada nunca cuenta como
# fallo para el circuito. Ver BffDonatonApplication.
bff.http.connect-timeout-ms=2000
bff.http.read-timeout-ms=3000

# Exponer el estado de los circuitos (OPEN/CLOSED/HALF_OPEN) vía Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ───────────────────────────────────────────────────────────
# Seguridad: CORS restringido al origen del frontend (antes era "*")
# ───────────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
