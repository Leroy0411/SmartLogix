server.port=8081
spring.application.name=ms-inventario

# ───────────────────────────────────────────────────────────
# Persistencia: base de datos H2 embebida en archivo
# (cumple el requisito de persistencia real mediante JPA)
# ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/inventario-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 (http://localhost:8081/h2-console) — util para verificar persistencia
# Nota de seguridad: solo accesible localmente (spring.h2.console.settings.web-allow-others
# no está activado, por lo que queda en su valor por defecto = false). Se recomienda
# deshabilitarla por completo (spring.h2.console.enabled=false) en cualquier despliegue
# fuera del entorno de desarrollo/demo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ───────────────────────────────────────────────────────────
# Seguridad
# ───────────────────────────────────────────────────────────
# CORS: solo se acepta el origen del frontend (antes era "*")
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# API key exigida en POST/PUT/DELETE (ver ApiKeyFilter). Sobrescribir con la
# variable de entorno API_KEY en cualquier entorno real; el valor por defecto
# es solo para desarrollo local.
app.security.api-key=${API_KEY:smartlogix-dev-key}
